<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dodge Aeris Camera Prototype</title><style>body{margin:0;overflow:hidden;font:14px sans-serif}#ui{position:absolute;top:12px;left:12px;background:#ffffffe0;padding:12px;border-radius:10px}button,select{font:inherit}canvas{display:block;touch-action:none}</style><div id="ui"><b>Dodge Aeris — 3D Prototype</b><p>WASD เดิน | ลากหน้าจอหมุนกล้อง | Scroll ซูม</p><select id="mode"><option value="free">Free Camera</option><option value="fixed">Fixed Camera</option><option value="follow">Follow Camera</option></select><button id="reset">Reset</button></div><script type="module">
import * as T from 'https://esm.sh/three@0.170.0';
const scene=new T.Scene();scene.background=new T.Color('#b9e5fc');const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x69866a,3));const light=new T.DirectionalLight(0xffffff,2);light.position.set(4,8,5);scene.add(light);
function mesh(geometry,color,parent,x=0,y=0,z=0){let m=new T.Mesh(geometry,new T.MeshStandardMaterial({color}));m.position.set(x,y,z);parent.add(m);return m}
mesh(new T.BoxGeometry(70,.1,70),0x80bc78,scene,0,-.1,0);mesh(new T.BoxGeometry(5,.02,60),0xd8c9a0,scene,0,0,0);mesh(new T.BoxGeometry(60,.02,5),0xd8c9a0,scene,0,0,0);
const player=new T.Group();scene.add(player);mesh(new T.BoxGeometry(.9,1,.55),0x397dc7,player,0,1.25,0);mesh(new T.SphereGeometry(.65,16,12),0xffd0a8,player,0,2.28,0);mesh(new T.SphereGeometry(.65,16,12,0,Math.PI*2,0,Math.PI*.35),0x4c3228,player,0,2.32,0);
const arms=[],legs=[];for(let x of [-.6,.6]){let p=new T.Group();p.position.set(x,1.65,0);player.add(p);mesh(new T.BoxGeometry(.27,.75,.3),0x397dc7,p,0,-.37,0);arms.push(p)}for(let x of [-.23,.23]){let p=new T.Group();p.position.set(x,.72,0);player.add(p);mesh(new T.BoxGeometry(.3,.72,.4),0x364d79,p,0,-.35,0);legs.push(p)}
const mode=document.querySelector('#mode');mode.value=localStorage.getItem('dodge-camera')||'free';mode.onchange=()=>localStorage.setItem('dodge-camera',mode.value);let yaw=.7,pitch=.8,dist=9;document.querySelector('#reset').onclick=()=>{yaw=.7;pitch=.8;dist=9};const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
let drag=false,px=0,py=0;const c=renderer.domElement;c.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointerup=()=>drag=false;c.onpointermove=e=>{if(!drag||mode.value==='fixed')return;yaw-=(e.clientX-px)*.006;pitch=T.MathUtils.clamp(pitch+(e.clientY-py)*.004,.25,1.3);px=e.clientX;py=e.clientY};c.onwheel=e=>{dist=T.MathUtils.clamp(dist+Math.sign(e.deltaY),4,18)};c.oncontextmenu=e=>e.preventDefault();
const clock=new T.Clock();let step=0;function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.05),x=Number(keys.has('d'))-Number(keys.has('a')),z=Number(keys.has('s'))-Number(keys.has('w'));if(x||z){let len=Math.hypot(x,z);x/=len;z/=len;let dx=x*Math.cos(yaw)+z*Math.sin(yaw),dz=-x*Math.sin(yaw)+z*Math.cos(yaw);player.position.x+=dx*dt*4;player.position.z+=dz*dt*4;let target=Math.atan2(-dx,-dz);player.rotation.y+=Math.atan2(Math.sin(target-player.rotation.y),Math.cos(target-player.rotation.y))*Math.min(1,dt*12);step+=dt*11}let swing=(x||z)?Math.sin(step)*.5:0;legs[0].rotation.x=swing;legs[1].rotation.x=-swing;arms[0].rotation.x=-swing;arms[1].rotation.x=swing;if(mode.value==='fixed')yaw=.7;if(mode.value==='follow'){let diff=Math.atan2(Math.sin(player.rotation.y-yaw),Math.cos(player.rotation.y-yaw));yaw+=diff*Math.min(1,dt*3)}let target=player.position.clone().add(new T.Vector3(0,1.2,0));camera.position.lerp(target.clone().add(new T.Vector3(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist)),Math.min(1,dt*10));camera.lookAt(target);renderer.render(scene,camera)}frame();onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></html>
